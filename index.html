<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirage — Karthik Yadlapalli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Karthik Yadlapalli — mobile apps end to end. Flutter, SwiftUI and the backends behind them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;600&family=Syne:wght@600;800&display=swap">
<style>
/* Layout: one fixed WebGL stage; DOM panels float over it, a field-instrument HUD rims the edges.
   Single committed look (a desert day): ink colour is re-tinted by JS as the sky changes. */
:root {
  --ink: #f4ebe0;            /* bone; JS swaps toward umber at noon */
  --ink-dim: rgba(244,235,224,.66);
  --scrim: rgba(18,10,20,.38);
  --ember: #ff7a3d;          /* dusk accent */
  --sand: #d9a07a;
  --night: #070812;
  --display: 'Syne', 'Arial Black', 'Helvetica Neue', sans-serif;
  --mono: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --gx: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--night); color: var(--ink);
  font-family: var(--mono); font-size: 13px; line-height: 1.6;
  overflow: hidden; overscroll-behavior: none; touch-action: none;
  padding-left: var(--gx); padding-right: var(--gr);
  -webkit-font-smoothing: antialiased;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
.eyebrow { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-dim); margin: 0; }

/* ---------- loader ---------- */
#loader {
  position: fixed; inset: 0; z-index: 50; background: #0d0a0c; color: #efe2d2;
  display: grid; place-items: center; transition: opacity 1.2s ease, visibility 1.2s;
}
#loader.gone { opacity: 0; visibility: hidden; }
.ld { display: grid; gap: 22px; justify-items: center; text-align: center; padding-inline: 16px; }
.ld-bar { font-size: 15px; letter-spacing: .12em; white-space: pre; color: #f2c9a0; }
.ld-meta { display: flex; gap: 18px; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: rgba(239,226,210,.55); font-variant-numeric: tabular-nums; }
.ld-enter { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; opacity: 0; transform: translateY(6px); transition: .8s ease; pointer-events: none; }
.ld-enter.on { opacity: 1; transform: none; pointer-events: auto; }
.ld-enter button { border: 1px solid rgba(239,226,210,.35); padding: 11px 18px; letter-spacing: .16em; font-size: 10.5px; text-transform: uppercase; transition: background .3s, color .3s; }
.ld-enter button:hover, .ld-enter button:focus-visible { background: #efe2d2; color: #0d0a0c; }

/* ---------- HUD ---------- */
.hud { position: fixed; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  padding-left: calc(var(--gx) + 8px); padding-right: calc(var(--gr) + 8px); pointer-events: none; transition: color .6s; }
.hud > * { pointer-events: auto; }
.hud-top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 18px); }
.hud-bot { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); align-items: flex-end; }
.mark { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .04em; text-decoration: none; }
.mark small { font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: .2em; color: var(--ink-dim); margin-left: 10px; }
.tools { display: flex; gap: 20px; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; }
.tools button { display: inline-flex; gap: 8px; align-items: center; }
.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
.eq i { width: 2px; background: currentColor; height: 3px; transition: height .3s; }
.sound-on .eq i { animation: eq 1.1s ease-in-out infinite; }
.sound-on .eq i:nth-child(2) { animation-delay: -.4s; } .sound-on .eq i:nth-child(3) { animation-delay: -.7s; }
@keyframes eq { 50% { height: 10px; } }

.readout { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.readout dt { color: var(--ink-dim); } .readout dd { margin: 0; }

.gauge { display: grid; gap: 8px; width: min(360px, 52vw); }
.gauge-track { position: relative; height: 18px; }
.gauge-track::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 1px; background: var(--ink-dim); opacity: .5; }
.gauge-fill { position: absolute; left: 0; top: 7px; height: 3px; background: var(--ink); width: 0; }
.tick { position: absolute; top: 2px; width: 14px; height: 14px; margin-left: -7px; display: grid; place-items: center; }
.tick::after { content: ""; width: 5px; height: 5px; border: 1px solid var(--ink); transform: rotate(45deg); background: transparent; transition: background .3s; }
.tick.on::after { background: var(--ink); }
.gauge-labels { display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: .2em; color: var(--ink-dim); }
.hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); transform: translateX(-50%); font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-dim); z-index: 15; transition: opacity .6s; text-align: center; }

/* ---------- panels ---------- */
#panels { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
.panel {
  position: absolute; top: 50%; transform: translateY(-46%);
  width: min(460px, 42vw); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px;
  opacity: 0; visibility: hidden; transition: opacity .7s ease, transform .9s cubic-bezier(.2,.7,.2,1), visibility .7s;
  text-shadow: 0 1px 18px var(--scrim);
}
.panel.on { opacity: 1; visibility: visible; transform: translateY(-50%); pointer-events: auto; }
.panel.left { left: calc(var(--gx) + 6vw); }
.panel.right { right: calc(var(--gr) + 6vw); }
.panel h2, .panel h1 { margin: 0; text-wrap: balance; }

.hero { width: min(820px, 86vw); left: calc(var(--gx) + 5vw); top: 54%; }
.name { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 9.4vw, 138px); line-height: .86; letter-spacing: -.035em; text-transform: uppercase; display: grid; }
.name span:last-child { padding-left: .55em; }
.lede { max-width: 46ch; font-size: 14px; margin: 6px 0 0; }

.pnum { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.status { font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; padding: 3px 8px; border: 1px solid currentColor; }
.ptitle { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 4.8vw, 76px); line-height: .92; letter-spacing: -.03em; }
.pdesc { margin: 0; max-width: 44ch; font-size: 13px; }
.stack { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.stack li::before { content: "◇ "; color: var(--gem, var(--ink)); }
.plinks { display: flex; gap: 22px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.plinks a { text-decoration: none; border-bottom: 1px solid var(--ink-dim); padding-bottom: 2px; }
.plinks a:hover { border-color: var(--ink); }
.gem { display: inline-block; width: 8px; height: 8px; transform: rotate(45deg); background: var(--gem); box-shadow: 0 0 12px var(--gem); }

.strata { list-style: none; padding: 0; margin: 0; display: grid; }
.strata li { display: grid; grid-template-columns: 70px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--ink) 28%, transparent); }
.strata li:last-child { border-bottom: 1px solid color-mix(in srgb, var(--ink) 28%, transparent); }
.depth { font-size: 10px; letter-spacing: .14em; color: var(--ink-dim); font-variant-numeric: tabular-nums; padding-top: 2px; }
.strata b { display: block; font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: .01em; }
.strata span { font-size: 11.5px; color: var(--ink-dim); }

.signals { list-style: none; padding: 0; margin: 0; display: grid; }
.signals li { border-top: 1px solid color-mix(in srgb, var(--ink) 28%, transparent); }
.signals li:last-child { border-bottom: 1px solid color-mix(in srgb, var(--ink) 28%, transparent); }
.sig { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; text-decoration: none; width: 100%; flex-wrap: wrap; }
.sig b { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3vw, 38px); letter-spacing: -.01em; transition: letter-spacing .4s, color .3s; }
.sig:hover b, .sig:focus-visible b { letter-spacing: .04em; color: var(--ember); }
.sig small { font-size: 10.5px; letter-spacing: .12em; color: var(--ink-dim); user-select: all; }
.copy { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; border: 1px solid var(--ink-dim); padding: 3px 8px; }

/* ---------- text log ---------- */
#log { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: #120d10; color: #efe2d2;
  padding-block: calc(env(safe-area-inset-top, 0px) + 72px) 80px; padding-left: var(--gx); padding-right: var(--gr); touch-action: pan-y; }
#log .wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 40px; }
#log h2 { font-family: var(--display); font-weight: 800; font-size: 34px; margin: 0 0 6px; letter-spacing: -.02em; }
#log h3 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 18px 0 2px; }
#log p { margin: 4px 0; max-width: 62ch; color: rgba(239,226,210,.8); }
#log .close { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); right: calc(var(--gr) + 8px); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; border: 1px solid rgba(239,226,210,.4); padding: 8px 12px; background: #120d10; }

/* ---------- phone ---------- */
@media (max-width: 760px), (max-aspect-ratio: 9/10) {
  .panel, .panel.left, .panel.right { left: var(--gx); right: var(--gr); width: auto; top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 116px); transform: translateY(12px); }
  .panel.on { transform: none; }
  .hero { top: auto; }
  .readout { display: none; }
  .gauge { width: 100%; }
  .hud-bot { justify-content: center; }
  .mark small { display: none; }
  .tools { gap: 14px; }
  .strata li { padding: 8px 0; grid-template-columns: 56px 1fr; }
  .strata b { font-size: 15px; }
  .hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); }
}
@media (prefers-reduced-motion: reduce) {
  .panel, .panel.on { transition: opacity .3s; }
  .sound-on .eq i { animation: none; height: 8px; }
}
</style>
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>

<div id="loader" role="dialog" aria-label="Loading">
  <div class="ld">
    <div class="ld-bar" id="ldBar" aria-hidden="true">· · · · · · · · · · · ·</div>
    <div class="ld-meta"><span id="ldMsg">Reading the wind</span><span id="ldPct">000%</span></div>
    <div class="ld-enter" id="ldEnter">
      <button id="enterSound" type="button">Enter with sound</button>
      <button id="enterQuiet" type="button">Enter in silence</button>
    </div>
  </div>
</div>

<header class="hud hud-top">
  <a class="mark" href="#" id="home">K—Y<small>Mirage · field survey</small></a>
  <nav class="tools">
    <button type="button" id="soundBtn" aria-pressed="false"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="soundLbl">Sound off</span></button>
    <button type="button" id="logBtn">Read as text</button>
  </nav>
</header>

<main id="panels"></main>

<div class="hint" id="hint">Scroll to cross the dunes</div>

<footer class="hud hud-bot">
  <dl class="readout" aria-label="Field readout">
    <dt>Local time</dt><dd id="rClock">05:42</dd>
    <dt>Air temp</dt><dd id="rTemp">14°C</dd>
    <dt>Light alt</dt><dd id="rAlt">3°</dd>
    <dt>Bearing</dt><dd id="rBrg">090° E</dd>
    <dt>Wind</dt><dd id="rWind">12 km/h</dd>
  </dl>
  <div class="gauge">
    <div class="gauge-track" id="gTrack"><div class="gauge-fill" id="gFill"></div></div>
    <div class="gauge-labels" aria-hidden="true"><span>Dawn</span><span>Noon</span><span>Dusk</span><span>Night</span></div>
  </div>
</footer>

<article id="log" hidden aria-label="Portfolio as text">
  <button type="button" class="close" id="logClose">Back to the dunes</button>
  <div class="wrap" id="logWrap"></div>
</article>

<script>
/* Loader runs before the 3D module arrives: a sand-density ASCII bar. */
(function(){
  var report = function(msg){ var m = document.getElementById('ldMsg'); if (m) m.textContent = 'Error: ' + String(msg).slice(0, 160); };
  window.addEventListener('error', function(e){ report((e.message || (e.target && (e.target.src || e.target.href)) || 'load failed') + (e.lineno ? ' @' + e.lineno : '')); }, true);
  window.addEventListener('unhandledrejection', function(e){ report(e.reason && (e.reason.message || e.reason)); });
  var ramp = ' ·:;=+*#', bar = document.getElementById('ldBar'), pct = document.getElementById('ldPct');
  var W = 22, target = 0.06, shown = 0, t = 0, done = false;
  window.__loader = { set: function(p){ target = Math.max(target, p); }, finish: function(){ target = 1; done = true; } };
  (function tick(){
    t += 1; shown += (target - shown) * 0.08;
    var s = '';
    for (var i = 0; i < W; i++) {
      var filled = i / W < shown;
      var wave = Math.sin(i * 0.7 - t * 0.18) * 0.5 + 0.5;
      var k = filled ? Math.min(ramp.length - 1, 4 + Math.round(wave * 3)) : Math.round(wave * 2);
      s += ramp[k];
    }
    bar.textContent = s;
    pct.textContent = String(Math.round(shown * 100)).padStart(3, '0') + '%';
    if (!(done && shown > 0.995)) requestAnimationFrame(tick);
    else { pct.textContent = '100%'; document.dispatchEvent(new Event('loader:ready')); }
  })();
})();
</script>

<script type="text/plain" id="sculptSrc">
/* Ruins sculptor — runs in a Web Worker.
   Each monument is a signed-distance field (negative inside stone) built from
   primitives, smooth unions, fractures and erosion noise. Marching cubes turns
   it into a mesh; normals come from the field gradient, AO from short SDF
   probes along the normal, and paint() bakes stone colour, pigment traces and
   hieroglyph regions into vertex attributes. */
'use strict';
let EDGE, TRI;

/* ---------- noise ---------- */
function hash(i, j, k) {
  let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(k, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function noise(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  let fx = x - ix, fy = y - iy, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const a = hash(ix, iy, iz), b = hash(ix + 1, iy, iz), c = hash(ix, iy + 1, iz), d = hash(ix + 1, iy + 1, iz);
  const e = hash(ix, iy, iz + 1), f = hash(ix + 1, iy, iz + 1), g = hash(ix, iy + 1, iz + 1), h = hash(ix + 1, iy + 1, iz + 1);
  const x1 = a + (b - a) * fx, x2 = c + (d - c) * fx, x3 = e + (f - e) * fx, x4 = g + (h - g) * fx;
  const y1 = x1 + (x2 - x1) * fy, y2 = x3 + (x4 - x3) * fy;
  return y1 + (y2 - y1) * fz;
}
function fbm(x, y, z, o) {
  let a = 0.5, s = 0, n = 0;
  for (let i = 0; i < o; i++) { s += a * noise(x, y, z); n += a; x = x * 2.03 + 17.1; y = y * 2.03 + 3.7; z = z * 2.03 + 5.3; a *= 0.5; }
  return s / n;
}

/* ---------- primitives ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mix = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const L3 = (x, y, z) => Math.sqrt(x * x + y * y + z * z);
function sdBox(x, y, z, bx, by, bz, r) {
  r = r || 0;
  const qx = Math.abs(x) - bx + r, qy = Math.abs(y) - by + r, qz = Math.abs(z) - bz + r;
  return L3(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qy, qz), 0) - r;
}
function sdEll(x, y, z, a, b, c) {
  const k0 = L3(x / a, y / b, z / c);
  if (k0 < 1e-6) return -Math.min(a, b, c);
  const k1 = L3(x / (a * a), y / (b * b), z / (c * c));
  return k0 * (k0 - 1) / k1;
}
// capsule whose radius blends from ra (at A) to rb (at B)
function sdCone2(px, py, pz, ax, ay, az, bx, by, bz, ra, rb) {
  const pax = px - ax, pay = py - ay, paz = pz - az, bax = bx - ax, bay = by - ay, baz = bz - az;
  const h = clamp((pax * bax + pay * bay + paz * baz) / (bax * bax + bay * bay + baz * baz), 0, 1);
  return L3(pax - bax * h, pay - bay * h, paz - baz * h) - mix(ra, rb, h);
}
function smin(a, b, k) { const h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1); return b + (a - b) * h - k * h * (1 - h); }
function smax(a, b, k) { return -smin(-a, -b, k); }

/* ---------- rigid transforms ---------- */
// R = product of axis rotations applied in the given order; stores inverse for world → local
function xform(ops, tx, ty, tz) {
  let m = [1, 0, 0, 0, 1, 0, 0, 0, 1];
  for (const [ax, a] of ops) {
    const c = Math.cos(a), s = Math.sin(a);
    const r = ax === 'x' ? [1, 0, 0, 0, c, -s, 0, s, c] : ax === 'y' ? [c, 0, s, 0, 1, 0, -s, 0, c] : [c, -s, 0, s, c, 0, 0, 0, 1];
    const o = new Array(9);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) o[i * 3 + j] = r[i * 3] * m[j] + r[i * 3 + 1] * m[3 + j] + r[i * 3 + 2] * m[6 + j];
    m = o;
  }
  return { m, tx, ty, tz };
}
let LX = 0, LY = 0, LZ = 0;
function toLocal(T, x, y, z) {
  const dx = x - T.tx, dy = y - T.ty, dz = z - T.tz, m = T.m;
  LX = m[0] * dx + m[3] * dy + m[6] * dz; LY = m[1] * dx + m[4] * dy + m[7] * dz; LZ = m[2] * dx + m[5] * dy + m[8] * dz;
}

/* paint output registers */
let PR, PG, PB, PGLYPH, PU, PV, PGLOW, PSPECK, PID;
function paintReset(r, g, b, speck) { PR = r; PG = g; PB = b; PGLYPH = 0; PU = 0; PV = 0; PGLOW = 0; PSPECK = speck; }
function tint(k) { PR *= k; PG *= k; PB *= k; }
function blendCol(r, g, b, t) { PR = mix(PR, r, t); PG = mix(PG, g, t); PB = mix(PB, b, t); }

/* =====================================================================
   1. FALLEN OBELISK — red Aswan granite, broken in three
   ===================================================================== */
const OB = (() => {
  const halfW = y => y < 28 ? 1.65 - y * 0.021 : 1.062 * (30.5 - y) / 2.5;
  function shaft(x, y, z) { return Math.max(Math.max(Math.abs(x), Math.abs(z)) - halfW(y), -y, y - 30.5) * 0.86; }
  const jag = (x, z, seed) => (fbm(x * 0.85 + seed, seed * 3.1, z * 0.85, 3) - 0.5) * 1.7 + x * 0.12 - z * 0.07;
  const pieces = [
    { a: -1, b: 8.2, sa: 0, sb: 11, T: xform([], 0, -0.9, 0), yc: 0 },
    { a: 8.2, b: 17.6, sa: 11, sb: 23, T: xform([['y', 0.3], ['z', -Math.PI / 2], ['y', 0.38]], 6.9, 1.12, 5.4), yc: 12.9 },
    { a: 17.6, b: 31, sa: 23, sb: 0, T: xform([['y', 0.9], ['z', -Math.PI / 2 + 0.13], ['y', 2.55]], -5.6, 0.62, 10.2), yc: 24.2 },
  ];
  function piece(p, x, y, z) {
    toLocal(p.T, x, y, z); const lx = LX, ly = LY + p.yc, lz = LZ;
    let d = shaft(lx, ly, lz);
    if (d > 3) return d;
    if (p.a > 0) d = Math.max(d, (p.a - ly) + jag(lx, lz, p.sa));
    if (p.b < 30) d = Math.max(d, (ly - p.b) - jag(lx, lz, p.sb));
    return d;
  }
  const rubble = [[2.6, 0.2, 2.2, 0.7, 0.4], [-2.2, 0.1, 3.4, 0.55, 1.3], [9.8, 0.1, 2.0, 0.6, 2.1], [-1.4, 0.15, 7.0, 0.8, 0.7], [1.2, 0.0, -2.4, 0.5, 2.6], [-8.5, 0.1, 6.4, 0.65, 1.9]];
  function sdf(x, y, z) {
    let d = 1e9, id = 0;
    for (let i = 0; i < 3; i++) { const di = piece(pieces[i], x, y, z); if (di < d) { d = di; id = i; } }

const COL = (() => {

    if (y < top - 2.4) return base;

function build(mon, progress) {

  for (let k = 0; k < nz; k++) {

    for (let j = 0; j < ny; j++) {
      const y = min[1] + j * cell, row = k * sxy + j * nx;
      for (let i = 0; i < nx; i++) F[row + i] = sdf(min[0] + i * cell, y, z);

  }
  const vmap = new Map(), pos = [], idx = [];

    const g = gk * sxy + gj * nx + gi, key = g * 3 + axis;
    let v = vmap.get(key);
    if (v !== undefined) return v;
    const g2 = g + (axis === 0 ? 1 : axis === 1 ? nx : sxy);
    const a = F[g], b = F[g2], t = a / (a - b);
    v = pos.length / 3; vmap.set(key, v);
    pos.push(min[0] + (gi + (axis === 0 ? t : 0)) * cell, min[1] + (gj + (axis === 1 ? t : 0)) * cell, min[2] + (gk + (axis === 2 ? t : 0)) * cell);
    return v;
  };
  const ev = new Int32Array(12);
  for (let k = 0; k < nz - 1; k++) for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
    let ci = 0;
    for (let c = 0; c < 8; c++) if (F[(k + CORNER[c][2]) * sxy + (j + CORNER[c][1]) * nx + i + CORNER[c][0]] < 0) ci |= 1 << c;
    const em = EDGE[ci]; if (!em) continue;
    for (let e = 0; e < 12; e++) if (em & (1 << e)) { const d = EDGE_DEF[e]; ev[e] = vert(i + d[0], j + d[1], k + d[2], d[3]); }
    const o = ci << 4;
    for (let t = 0; TRI[o + t] !== -1; t += 3) idx.push(ev[TRI[o + t]], ev[TRI[o + t + 1]], ev[TRI[o + t + 2]]);
  }
  progress(0.85);
  const n = pos.length / 3;
  const P = new Float32Array(pos), N = new Float32Array(n * 3), C = new Float32Array(n * 3), UV = new Float32Array(n * 2), INFO = new Float32Array(n * 4);
  const e = cell * 0.5, lin = c => Math.pow(clamp(c, 0, 1), 2.2);
  for (let v = 0; v < n; v++) {
    const x = P[v * 3], y = P[v * 3 + 1], z = P[v * 3 + 2];
    let gx = sdf(x + e, y, z) - sdf(x - e, y, z), gy = sdf(x, y + e, z) - sdf(x, y - e, z), gz = sdf(x, y, z + e) - sdf(x, y, z - e);
    const gl = Math.hypot(gx, gy, gz) || 1; gx /= gl; gy /= gl; gz /= gl;
    N[v * 3] = gx; N[v * 3 + 1] = gy; N[v * 3 + 2] = gz;
    // ambient occlusion: probe the field (and the sand plane) along the normal
    let occ = 0, w = 1;
    for (let s = 1; s <= 5; s++) {
      const h = s * 0.32, px = x + gx * h, py = y + gy * h, pz = z + gz * h;
      occ += (h - Math.min(sdf(px, py, pz), py + 0.15)) * w; w *= 0.6;
    }
    const ao = clamp(1 - occ * 0.55, 0.12, 1) * mix(0.55, 1, sstep(-0.2, 1.4, y));
    sdf(x, y, z); mon.paint(x, y, z);
    C[v * 3] = lin(PR); C[v * 3 + 1] = lin(PG); C[v * 3 + 2] = lin(PB);
    UV[v * 2] = PU; UV[v * 2 + 1] = PV;
    INFO[v * 4] = ao; INFO[v * 4 + 1] = PGLYPH; INFO[v * 4 + 2] = PGLOW; INFO[v * 4 + 3] = PSPECK;
  }
  const I = new Uint32Array(idx);
  // make winding agree with the field gradient
  for (let t = 0; t < I.length; t += 3) {
    const a = I[t] * 3, b = I[t + 1] * 3, c = I[t + 2] * 3;
    const ux = P[b] - P[a], uy = P[b + 1] - P[a + 1], uz = P[b + 2] - P[a + 2], vx = P[c] - P[a], vy = P[c + 1] - P[a + 1], vz = P[c + 2] - P[a + 2];
    const fx = uy * vz - uz * vy, fy = uz * vx - ux * vz, fz = ux * vy - uy * vx;
    if (fx * (N[a] + N[b] + N[c]) + fy * (N[a + 1] + N[b + 1] + N[c + 1]) + fz * (N[a + 2] + N[b + 2] + N[c + 2]) < 0) { const tmp = I[t + 1]; I[t + 1] = I[t + 2]; I[t + 2] = tmp; }
  }
  progress(1);
  return { P, N, C, UV, INFO, I, height: mon.height };
}

self.onmessage = e => {
  const { edge, tri, ids } = e.data;
  EDGE = edge; TRI = tri;
  for (const id of ids) {
    const r = build(MONUMENTS[id], f => self.postMessage({ type: 'progress', id, f }));
    self.postMessage({ type: 'mesh', id, ...r }, [r.P.buffer, r.N.buffer, r.C.buffer, r.UV.buffer, r.INFO.buffer, r.I.buffer]);
  }
};

function sculpt(onProgress) {
  const src = document.getElementById('sculptSrc').textContent;
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  const nW = Math.max(1, Math.min(5, (navigator.hardwareConcurrency || 4) - 1));
  const jobs = Array.from({ length: nW }, () => []);
  [1, 4, 0, 3, 2].forEach((id, k) => jobs[k % nW].push(id));        // heaviest first
  const prog = new Array(5).fill(0);

    const w = new Worker(url);

    w.onmessage = ({ data: d }) => {
      if (d.type === 'progress') { prog[d.id] = d.f; onProgress(prog.reduce((a, b) => a + b) / 5); return; }

  uniform sampler2D tScene; uniform float uTime, uHaze, uMirage, uHorizon, uAberr, uFade, uExposure; uniform vec2 uRes; varying vec2 vUv;
  vec3 aces(vec3 x){ return clamp((x * (2.51 * x + .03)) / (x * (2.43 * x + .59) + .14), 0., 1.); }
  void main(){
    vec2 uv = vUv; float yh = uHorizon;
    float band = smoothstep(.22, 0., abs(uv.y - yh + .03));
    float wob = sin(uv.y * 160. + uTime * 4.2 + sin(uv.x * 26. + uTime * 1.4) * 2.2);
    uv.x += wob * .0017 * uHaze * band;
    uv.y += cos(uv.x * 80. + uTime * 3.1) * .0008 * uHaze * band;
    vec2 c = uv - .5;
    float ab = uAberr * (.004 + .018 * dot(c, c));
    vec3 col = vec3(texture2D(tScene, uv + c * ab).r, texture2D(tScene, uv).g, texture2D(tScene, uv - c * ab).b);
    float depth = yh - uv.y;
    if (uMirage > .001 && depth > 0. && depth < .045) {
      vec2 mu = vec2(uv.x + wob * .003, yh + depth * 1.6 + .004);
      vec3 refl = texture2D(tScene, clamp(mu, 0., 1.)).rgb;
      col = mix(col, refl, uMirage * .6 * smoothstep(.045, .008, depth) * smoothstep(0., .006, depth));
    }
    col = aces(col * uExposure);
    col = pow(col, vec3(1. / 2.2));
    col *= mix(1., smoothstep(1.15, .25, length(c * vec2(1., 1.25))), .45);
    float g = fract(sin(dot(vUv * uRes + fract(uTime) * 91., vec2(12.9898, 78.233))) * 43758.5453);
    col += (g - .5) * .04;
    gl_FragColor = vec4(col * uFade, 1.);
  }`,
}));
const postScene = new THREE.Scene(); postScene.add(post);
const postCam = new THREE.Camera();
window.__loader?.set(0.2);

/* =====================================================================
   DAY CYCLE — palette keyed by time of day (0 dawn … 1 night)
   az: degrees relative to the route (0 = straight ahead = due east)
   ===================================================================== */
const DAY = [
  { t: 0,   z: '#27325e', h: '#f0a184', s: '#ffc9a0', sand: '#c98f72', az: -25, el: 4,  sunI: 3.2, hemiI: 1.1, exp: 1.05, ink: 0,   haze: .1, temp: 14, clock: 5 * 60 + 42 },
  { t: .2,  z: '#4a78b8', h: '#f6d2b0', s: '#fff0dc', sand: '#deae82', az: 25,  el: 30, sunI: 4.2, hemiI: 1.4, exp: .9,  ink: .7,  haze: .5, temp: 29, clock: 8 * 60 + 30 },
  { t: .45, z: '#5f97cf', h: '#efe4cf', s: '#fffaf0', sand: '#ecc995', az: 90,  el: 66, sunI: 4.6, hemiI: 1.5, exp: .82, ink: 1,   haze: 1,  temp: 46, clock: 12 * 60 + 50 },
  { t: .62, z: '#4d82c0', h: '#f3d6a8', s: '#ffe6c0', sand: '#e2b07a', az: 150, el: 36, sunI: 4.3, hemiI: 1.4, exp: .88, ink: .85, haze: .8, temp: 41, clock: 15 * 60 + 40 },
  { t: .78, z: '#382a5c', h: '#ff7b3f', s: '#ff9147', sand: '#b9653d', az: 205, el: 4,  sunI: 3.4, hemiI: 1.0, exp: 1.05, ink: 0,   haze: .2, temp: 30, clock: 18 * 60 + 24 },
  { t: .88, z: '#161b3d', h: '#6a4d78', s: '#7c5878', sand: '#5a4a66', az: 210, el: -4, sunI: .4,  hemiI: .9,  exp: 1.4, ink: 0,   haze: 0,  temp: 22, clock: 19 * 60 + 5 },
  { t: 1,   z: '#04050d', h: '#151c36', s: '#9fb2e0', sand: '#3a4268', az: 370, el: 32, sunI: .9,  hemiI: .6,  exp: 1.9, ink: 0,   haze: 0,  temp: 9,  clock: 22 * 60 + 30 },
].map(k => ({ ...k, z: new THREE.Color(k.z), h: new THREE.Color(k.h), s: new THREE.Color(k.s), sand: new THREE.Color(k.sand) }));
const sky_ = { z: new THREE.Color(), h: new THREE.Color(), s: new THREE.Color(), sand: new THREE.Color() };
function sampleDay(t) {
  let i = 0; while (i < DAY.length - 2 && t > DAY[i + 1].t) i++;
  const a = DAY[i], b = DAY[i + 1], k = clamp01((t - a.t) / (b.t - a.t)), out = {};
  for (const key of ['z', 'h', 's', 'sand']) sky_[key].copy(a[key]).lerp(b[key], k);
  for (const key of ['az', 'el', 'sunI', 'hemiI', 'exp', 'ink', 'haze', 'temp', 'clock']) out[key] = lerp(a[key], b[key], k);
  out.night = clamp01((t - .82) / .14);
  return out;
}
const TOD = [[0, 0], [.16, .2], [.40, .45], [.64, .62], [.80, .78], [.90, .9], [1, 1]];
function todAt(p) { let i = 0; while (i < TOD.length - 2 && p > TOD[i + 1][0]) i++; const [a0, a1] = TOD[i], [b0, b1] = TOD[i + 1]; return lerp(a1, b1, clamp01((p - a0) / (b0 - a0))); }

/* =====================================================================
   CAMERA ROUTE — keyframes at fixed progress stops, held with a plateau
   ===================================================================== */
const STOPS = [0, .16, .28, .40, .52, .64, .80, 1];
let camCurve, lookCurve;
function buildRoute() {
  const portrait = innerWidth / innerHeight < .9 || innerWidth < 760;
  const cams = [], looks = [];
  const g0 = ground(0, 60);
  cams.push(new THREE.Vector3(0, g0 + 11, 60)); looks.push(new THREE.Vector3(portrait ? 0 : 30, g0 + 13, -220));
  monuments.forEach((m, i) => {
    const f = m.frame, s = i % 2 === 0 ? 1 : -1;
    const look = new THREE.Vector3(...f.look).applyEuler(m.group.rotation).add(m.group.position);
    const dist = portrait ? f.dist * 1.3 : f.dist, lat = portrait ? 0 : dist * .36 * s;
    cams.push(new THREE.Vector3(look.x - lat * .55, look.y + f.up, look.z + dist));
    looks.push(new THREE.Vector3(look.x - lat, look.y - (portrait ? f.look[1] * .45 : 0), look.z));
  });
  const gd = ground(10, -480); cams.push(new THREE.Vector3(10, gd + 30, -480));
  const az = 205 * Math.PI / 180; looks.push(new THREE.Vector3(10 + Math.sin(az) * 400 + (portrait ? 0 : 60), gd + 18, -480 - Math.cos(az) * 400));
  const gn = ground(0, -500); cams.push(new THREE.Vector3(0, gn + 16, -500));
  looks.push(new THREE.Vector3(portrait ? 0 : -40, gn + 150, -790));
  camCurve = new THREE.CatmullRomCurve3(cams, false, 'centripetal');
  lookCurve = new THREE.CatmullRomCurve3(looks, false, 'centripetal');
  const nightDir = looks[7].clone().sub(cams[7]).normalize();
  starGroup.position.copy(cams[7]).addScaledVector(nightDir, 240);
  if (!portrait) starGroup.position.addScaledVector(new THREE.Vector3(1, 0, 0), 75);
  starGroup.lookAt(cams[7]);
  const sc = portrait ? .55 : 1; starGroup.scale.set(-sc, sc, sc);   // lookAt faces +z at the viewer, so un-mirror x
}
function routeParam(p) {
  let i = 0; while (i < STOPS.length - 2 && p > STOPS[i + 1]) i++;
  const t = clamp01((p - STOPS[i]) / (STOPS[i + 1] - STOPS[i]));
  const held = smooth(clamp01((t - .14) / .72));
  return (i + held) / (STOPS.length - 1);
}

/* =====================================================================
   INPUT — virtual scroll
   ===================================================================== */
let target = 0, prog = 0, prevProg = 0, vel = 0, lastInput = 0, entered = false;
const mouse = { x: 0, y: 0, sx: 0, sy: 0 };
const nudge = d => { if (!entered || !logEl.hidden) return; target = clamp01(target + d); lastInput = performance.now(); };
addEventListener('wheel', e => { if (!logEl.hidden) return; e.preventDefault(); const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1; nudge(e.deltaY * k * .00022); }, { passive: false });
let ty = null;
addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', e => { if (ty == null) return; const y = e.touches[0].clientY; nudge((ty - y) * .0011); ty = y; }, { passive: true });
addEventListener('touchend', () => ty = null);
const goStop = dir => { const cur = STOPS.reduce((b, s, i) => Math.abs(s - target) < Math.abs(STOPS[b] - target) ? i : b, 0); jump(Math.max(0, Math.min(STOPS.length - 1, cur + dir))); };
function jump(i) { if (!entered) return; target = STOPS[i]; lastInput = performance.now() - 2000; }
addEventListener('keydown', e => {
  if (!logEl.hidden) { if (e.key === 'Escape') document.getElementById('logClose').click(); return; }
  if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); goStop(1); }
  if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); goStop(-1); }
  if (e.key === 'Home') jump(0); if (e.key === 'End') jump(STOPS.length - 1);
});
addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth - .5; mouse.y = e.clientY / innerHeight - .5; });
document.getElementById('home').onclick = e => { e.preventDefault(); jump(0); };

const STOP_NAMES = ['Arrival', ...PROJECTS.map(p => p.title), 'Strata', 'Signals'];
const gTrack = document.getElementById('gTrack'), gFill = document.getElementById('gFill');
const ticks = STOPS.map((s, i) => { const b = document.createElement('button'); b.className = 'tick'; b.type = 'button'; b.style.left = (s * 100) + '%'; b.setAttribute('aria-label', 'Go to ' + STOP_NAMES[i]); b.onclick = () => jump(i); gTrack.appendChild(b); return b; });

panelsEl.querySelectorAll('[data-sig]').forEach(el => {
  const on = () => setSignal(el.dataset.sig), off = () => setSignal('COMPASS');
  el.addEventListener('pointerenter', on); el.addEventListener('focus', on);
  el.addEventListener('pointerleave', off); el.addEventListener('blur', off);
  el.addEventListener('touchstart', on, { passive: true });
});

/* =====================================================================
   AUDIO — procedural; igloo's "wind" track starts at 0 and follows motion
   ===================================================================== */
const audio = {
  ctx: null, on: false,
  start() {
    if (this.ctx) return this.resume();
    const C = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = C.createGain(); this.master.gain.value = 0; this.master.connect(C.destination);
    const buf = C.createBuffer(1, C.sampleRate * 3, C.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < d.length; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = C.createBufferSource(); src.buffer = buf; src.loop = true;
    this.bp = C.createBiquadFilter(); this.bp.type = 'bandpass'; this.bp.frequency.value = 420; this.bp.Q.value = .7;
    const lfo = C.createOscillator(), lg = C.createGain(); lfo.frequency.value = .07; lg.gain.value = 260; lfo.connect(lg).connect(this.bp.frequency); lfo.start();
    this.wind = C.createGain(); this.wind.gain.value = 0;
    src.connect(this.bp).connect(this.wind).connect(this.master); src.start();
    const lp = C.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
    this.drone = C.createGain(); this.drone.gain.value = .05; lp.connect(this.drone).connect(this.master);
    [[73.4, 'sine', .5], [110, 'sine', .35], [146.8, 'triangle', .12], [220.4, 'sine', .05]].forEach(([f, type, g]) => {
      const o = C.createOscillator(), og = C.createGain(); o.type = type; o.frequency.value = f; o.detune.value = (Math.random() - .5) * 8; og.gain.value = g; o.connect(og).connect(lp); o.start();
    });
    this.resume();
  },
  resume() { this.ctx.resume(); this.master.gain.setTargetAtTime(.7, this.ctx.currentTime, .8); this.on = true; ui(); },
  stop() { if (!this.ctx) return; this.master.gain.setTargetAtTime(0, this.ctx.currentTime, .4); this.on = false; ui(); },
  update(speed, night) {
    if (!this.on) return; const t = this.ctx.currentTime;
    this.wind.gain.setTargetAtTime(.1 + Math.min(.5, speed * 2.2) * (1 - night * .5), t, .25);
    this.bp.frequency.setTargetAtTime(380 + Math.min(900, speed * 2600), t, .3);
    this.drone.gain.setTargetAtTime(.04 + night * .03, t, 1);
  },
};
function ui() { const b = document.getElementById('soundBtn'); b.classList.toggle('sound-on', audio.on); b.setAttribute('aria-pressed', audio.on); document.getElementById('soundLbl').textContent = audio.on ? 'Sound on' : 'Sound off'; }
document.getElementById('soundBtn').onclick = () => audio.on ? audio.stop() : audio.start();
addEventListener('visibilitychange', () => { if (audio.ctx && audio.on) document.hidden ? audio.ctx.suspend() : audio.ctx.resume(); });

/* =====================================================================
   RESIZE + BOOT
   ===================================================================== */
function fitTitles() {
  panelsEl.querySelectorAll('.ptitle').forEach(el => {
    const shown = el.textContent; el.textContent = el.dataset.text ?? shown; el.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && fs > 22) { fs -= 2; el.style.fontSize = fs + 'px'; }
    el.textContent = shown;
  });
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w / h < .9 ? 64 : 52; camera.updateProjectionMatrix();
  rt.setSize(Math.floor(w * DPR), Math.floor(h * DPR)); post.material.uniforms.uRes.value.set(w * DPR, h * DPR);
  buildRoute(); fitTitles();
}
addEventListener('resize', resize);

await Promise.race([document.fonts.load('800 100px Syne'), new Promise(r => setTimeout(r, 2500))]).catch(() => {});
resize();
SHAPES.COMPASS = compassShape();
SIGNALS.forEach(s => SHAPES[s.key] = wordShape(s.key));
setSignal('COMPASS'); sp.set(SHAPES.COMPASS);
document.getElementById('ldMsg').textContent = 'Excavating the ruins';
await sculpt(f => window.__loader?.set(0.2 + f * 0.7));
await loadModels();
buildRoute();

camera.position.copy(camCurve.getPoint(0)); camera.lookAt(lookCurve.getPoint(0));
renderer.compile(scene, camera); renderer.compile(postScene, postCam);
document.getElementById('ldMsg').textContent = 'Reading the wind';
window.__loader?.finish();

let introT = -1, activePanel = -1;
document.addEventListener('loader:ready', () => {
  document.getElementById('ldMsg').textContent = 'The dunes are still';
  document.getElementById('ldEnter').classList.add('on');
  document.getElementById('enterSound').focus();
}, { once: true });
const enter = withSound => {
  if (withSound) audio.start();
  document.getElementById('loader').classList.add('gone');
  entered = true; introT = reduced ? 1 : 0;
};
document.getElementById('enterSound').onclick = () => enter(true);
document.getElementById('enterQuiet').onclick = () => enter(false);

/* =====================================================================
   FRAME
   ===================================================================== */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3(), fwd = new THREE.Vector3(), focus = new THREE.Vector3();
const CARD = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
let hudT = 0, windAcc = 0;
const inkA = new THREE.Color('#f4ebe0'), inkB = new THREE.Color('#1c1009'), inkC = new THREE.Color();
const rEl = id => document.getElementById(id);
const R = { clock: rEl('rClock'), temp: rEl('rTemp'), alt: rEl('rAlt'), brg: rEl('rBrg'), wind: rEl('rWind') };
const hint = rEl('hint');

function frame() {
  const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;
  U.uTime.value = time;

  if (entered && performance.now() - lastInput > 650) {
    const near = STOPS.reduce((b, s) => Math.abs(s - target) < Math.abs(b - target) ? s : b, 0);
    if (Math.abs(near - target) < .07) target = damp(target, near, 2.2, dt);
  }
  prevProg = prog; prog = damp(prog, target, 3, dt);
  vel = damp(vel, Math.abs(prog - prevProg) / Math.max(dt, 1e-4), 6, dt);

  // camera
  const u = routeParam(prog);
  camCurve.getPoint(u, camera.position); lookCurve.getPoint(u, tmpV);
  mouse.sx = damp(mouse.sx, mouse.x, 2.5, dt); mouse.sy = damp(mouse.sy, mouse.y, 2.5, dt);
  camera.position.x += mouse.sx * 3; camera.position.y -= mouse.sy * 1.6;
  if (introT >= 0 && introT < 1) introT = Math.min(1, introT + dt / 3.4);
  const ie = introT < 0 ? 0 : 1 - Math.pow(1 - introT, 3);
  camera.position.y -= (1 - ie) * 5; tmpV.y -= (1 - ie) * 46;
  camera.position.y = Math.max(camera.position.y, ground(camera.position.x, camera.position.z) + 2.6);
  camera.lookAt(tmpV);
  U.uCam.value.copy(camera.position); sky.position.copy(camera.position);

  // day cycle → sky, fog, sun, sky light
  const tod = todAt(prog), D = sampleDay(tod);
  U.uSkyZ.value.copy(sky_.z); U.uSkyH.value.copy(sky_.h); U.uSunCol.value.copy(sky_.s); U.uSand.value.copy(sky_.sand);
  scene.fog.color.copy(sky_.h);
  const az = D.az * Math.PI / 180, el = D.el * Math.PI / 180;
  U.uSunDir.value.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).normalize();
  U.uLow.value = 1 - clamp01(D.el / 35);
  U.uNight.value = D.night;
  sun.color.copy(sky_.s); sun.intensity = D.sunI * clamp01((D.el + 4) / 6);
  hemi.color.copy(sky_.z).lerp(sky_.h, .35); hemi.groundColor.copy(sky_.sand).multiplyScalar(.6); hemi.intensity = D.hemiI;
  // shadows follow whatever the camera is looking at
  camera.getWorldDirection(fwd);
  focus.copy(camera.position).addScaledVector(fwd, 34); focus.y = ground(focus.x, focus.z);
  sun.target.position.copy(focus); sun.position.copy(focus).addScaledVector(U.uSunDir.value, 160);
  windAcc += dt * (5 + vel * 60); U.uWind.value = windAcc;

  // reveals: inscriptions light up from the sand as you arrive
  monuments.forEach((m, i) => {
    const d = Math.abs(prog - STOPS[i + 1]);
    m.reveal = damp(m.reveal, clamp01((.075 - d) / .055), 2.4, dt);
    if (m.mat) m.mat.userData.u.uReveal.value = m.reveal;
    if (m.light) m.light.intensity = m.reveal * 60;
  });

  // signals
  const vis = clamp01((prog - .9) / .08);
  starMat.uniforms.uVis.value = vis;
  if (vis > .01) {
    kick = Math.max(0, kick - dt * .8);
    const k = 9, dm = Math.exp(-3.2 * dt);
    for (let i = 0; i < STAR_N; i++) {
      const j = i * 3;
      for (let a = 0; a < 3; a++) sv[j + a] = (sv[j + a] + (st[j + a] - sp[j + a]) * k * dt) * dm;
      const sw = 14 * kick + 1.5;
      sv[j] += Math.sin(sp[j + 1] * .05 + time * 1.3 + sr[i] * 6) * sw * dt;
      sv[j + 1] += Math.cos(sp[j] * .05 + time * 1.1) * sw * dt;
      sp[j] += sv[j] * dt; sp[j + 1] += sv[j + 1] * dt; sp[j + 2] += sv[j + 2] * dt;
      ss[i] = Math.hypot(sv[j], sv[j + 1]) / 55;
    }
    starGeo.attributes.position.needsUpdate = true; starGeo.attributes.aSpeed.needsUpdate = true;
  }

  // post
  const pu = post.material.uniforms;
  fwd.y = 0; fwd.normalize();
  tmpV.copy(camera.position).addScaledVector(fwd, 1500); tmpV.y = camera.position.y; tmpV.project(camera);
  pu.uHorizon.value = clamp01(tmpV.y * .5 + .5);
  pu.uHaze.value = reduced ? 0 : D.haze; pu.uMirage.value = D.haze;
  pu.uAberr.value = reduced ? 0 : Math.min(2.2, vel * 9) + (1 - ie) * 1.5;
  pu.uFade.value = ie; pu.uExposure.value = D.exp;

  // panels
  let k = -1; STOPS.forEach((s, i) => { if (Math.abs(prog - s) < (i === 0 ? .05 : .045)) k = i; });
  if (introT >= 0 && introT < .55) k = -1;
  if (k !== activePanel) {
    panels.forEach((p, i) => p.classList.toggle('on', i === k));
    if (k >= 0) panels[k].querySelectorAll('.scr').forEach((el, n) => setTimeout(() => scramble(el, reduced ? 1 : 900), n * 140));
    if (k !== 7) setSignal('COMPASS');
    activePanel = k;
  }
  hint.style.opacity = entered && prog < .03 && ie > .9 ? 1 : 0;

  // HUD (10 Hz)
  hudT += dt;
  if (hudT > .1) {
    hudT = 0;
    inkC.copy(inkA).lerp(inkB, sstep(.3, .5, D.ink));
    const rs = document.documentElement.style, hex = '#' + inkC.getHexString(), c255 = inkC.clone().convertLinearToSRGB();
    const rgb = `${Math.round(c255.r * 255)},${Math.round(c255.g * 255)},${Math.round(c255.b * 255)}`;
    rs.setProperty('--ink', hex); rs.setProperty('--ink-dim', `rgba(${rgb},${D.ink > .4 ? .82 : .7})`);
    rs.setProperty('--scrim', D.ink > .5 ? 'rgba(255,248,236,.55)' : 'rgba(18,10,20,.45)');
    const m = Math.round(D.clock); R.clock.textContent = String((m / 60 | 0) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    R.temp.textContent = Math.round(D.temp) + '°C';
    R.alt.textContent = (D.night > .5 ? 'Moon ' : '') + Math.round(D.el) + '°';
    camera.getWorldDirection(fwd);
    const brg = ((Math.atan2(fwd.x, -fwd.z) * 180 / Math.PI) + 90 + 360) % 360;
    R.brg.textContent = String(Math.round(brg)).padStart(3, '0') + '° ' + CARD[Math.round(brg / 22.5) % 16];
    R.wind.textContent = Math.round(9 + vel * 140) + ' km/h';
    gFill.style.width = (prog * 100) + '%';
    ticks.forEach((t, i) => t.classList.toggle('on', prog >= STOPS[i] - .01));
  }
  audio.update(vel, D.night);

  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
